name: SSH Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/github-actions-deploy
          chmod 600 ~/.ssh/github-actions-deploy

          ssh \
            -4 \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -i ~/.ssh/github-actions-deploy \
            "$EC2_USER@$EC2_HOST" \
            "echo 'SSH connection successful'; hostname; whoami"