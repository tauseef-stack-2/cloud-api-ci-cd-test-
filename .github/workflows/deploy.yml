name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Connected successfully"
            whoami
            pwd

            cd /home/ubuntu/docker-cloud-practice/cloud-api-ci-cd-test

            echo "Project directory:"
            pwd
            ls -la

            git pull origin main

            docker build -t docker-ec2-cloud-api:latest .

            docker stop ec2-docker-cloud-practice-api || true
            docker rm ec2-docker-cloud-practice-api || true

            docker run -d \
              --env-file .env \
              --name ec2-docker-cloud-practice-api \
              -p 3000:3000 \
              docker-ec2-cloud-api:latest

            echo "Deployment completed"
            docker ps